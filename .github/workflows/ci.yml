---
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          pipx run ruff check .
          pipx run ruff format --check .

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
